[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    unit: 单元测试（无外部依赖）
    api: API功能测试（TestClient）
    integration: 集成测试（需docker-compose）
    load: 压测（需运行中的后端服务）
