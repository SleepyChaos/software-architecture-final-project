apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-redis
  template:
    metadata:
      labels:
        app: library-redis
    spec:
      containers:
        - name: redis
          image: library-system-redis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
