apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-prometheus
  template:
    metadata:
      labels:
        app: library-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: library-prometheus-config
        - name: prometheus-data
          emptyDir: {}