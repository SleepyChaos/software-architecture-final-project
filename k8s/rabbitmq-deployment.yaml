apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-rabbitmq
  template:
    metadata:
      labels:
        app: library-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: rabbitmq-data
          emptyDir: {}