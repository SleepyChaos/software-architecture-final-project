services:
  frontend:
    container_name: library-frontend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

  backend:
    build:
      context: .
      dockerfile: backbone/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://library:library@db:5432/library
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_RECOMMENDED: 300
      CACHE_TTL_SUGGESTIONS: 180
    command: >
      sh -c "PYTHONPATH=/app uvicorn main:app --host 0.0.0.0 --port 8000"

  db:
    container_name: library-db
    image: pgvector/pgvector:pg17-trixie
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: library-redis
    image: redis:7-alpine
    expose:
      - "6379"

volumes:
  pgdata:
